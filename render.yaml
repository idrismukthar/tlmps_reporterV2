services:
  - type: web
    name: tlmps-portal
    runtime: node
    plan: starter
    disk:
      name: tlmps-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/tlmps.db
      - key: NODE_VERSION
        value: 20.19.1
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: TLMPS_JSS1_PASS
        sync: false
      - key: TLMPS_JSS2_PASS
        sync: false
      - key: TLMPS_JSS3_PASS
        sync: false
      - key: TLMPS_SSS1_PASS
        sync: false
      - key: TLMPS_SSS2_PASS
        sync: false
      - key: TLMPS_SSS3_PASS
        sync: false
